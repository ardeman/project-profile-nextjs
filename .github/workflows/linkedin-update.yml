name: Prepare LinkedIn profile update

on:
  push:
    branches: [main]
    paths:
      - 'public/linkedin/*.csv'
      - 'scripts/generate-linkedin-update*.mjs'
      - 'scripts/profile-data.mjs'
      - '.github/workflows/linkedin-update.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.10.1
      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test draft generation
        run: pnpm test:linkedin
      - name: Generate draft
        run: pnpm export:linkedin
      - name: Upload LinkedIn draft
        id: upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: linkedin-profile-update
          path: build/linkedin-update/
          if-no-files-found: error
          retention-days: 30
      - name: Explain next steps
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## LinkedIn profile draft ready

          Open `manual-sync-checklist.txt` from the downloadable artifact below.
          Review `linkedin-profile.txt`, then use `headline.txt`, `about.txt`,
          `experience.txt`, and `skills.txt` to update your LinkedIn profile.
          Match existing roles before adding any to avoid duplicate experience.
          `introduction.txt` is optional portfolio copy.

          This workflow prepares text only; it does not edit your LinkedIn account.
          The artifact is retained for 30 days.
          EOF
          printf '\n[Download the draft](%s)\n\nSource commit: `%s`.\n' "$ARTIFACT_URL" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
